services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  office-gate-in:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:attendance@postgres:5432/attendance_db
      CAMERA_ID: 11111111-1111-1111-1111-111111111111
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./insightface_model:/app/insightface_model
      - ./anti_spoof_model:/app/anti_spoof_model

  office-gate-out:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:attendance@postgres:5432/attendance_db
      CAMERA_ID: 22222222-2222-2222-2222-222222222222
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./insightface_model:/app/insightface_model
      - ./anti_spoof_model:/app/anti_spoof_model

volumes:
  postgres_data: